services:
  ahb:
    build: .
    network_mode: host      # برای باز بودن هر پورت دلخواه اینباند
    restart: always
    cap_add: [NET_ADMIN]                 # برای OpenVPN
    devices: ["/dev/net/tun:/dev/net/tun"]
    volumes: ["./data:/data"]
    # برای نود: environment: [NODE_KEY=کلید_دلخواه, NODE_PORT=62050]
